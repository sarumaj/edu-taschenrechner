# Converted from .github/workflows/deploy.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: deploy
'on':
  push:
    tags:
    - v*
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        go:
        - 1.26
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Deploy app to Heroku
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install go
      uses: https://github.com/actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
    - name: Export Module Name
      id: export_module_name
      run: echo "MODULE_NAME=$(go mod edit -json | jq -r '.Module.Path')" >> "$GITHUB_OUTPUT"
    - name: Install go tools
      run: |
        go install golang.org/x/tools/gopls@latest && \
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    - name: Run linters and tests
      run: |
        gofmt -s -d ./ && \
        golangci-lint run -v --timeout 5m --build-tags headless && \
        go test -v -race -tags headless ./...
    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh
    - name: Get app url
      uses: https://github.com/akhileshns/heroku-deploy@v3.15.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: ''
        heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
        justlogin: true
    - name: Deploy to Heroku
      uses: https://github.com/akhileshns/heroku-deploy@v3.15.15
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
        rollbackonhealthcheckfailed: true
        usedocker: true
    - name: Update code documentation
      run: curl -fsSL https://proxy.golang.org/${{ steps.export_module_name.outputs.MODULE_NAME }}/@v/${{
        github.ref_name }}.info
